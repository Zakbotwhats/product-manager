<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-card">
        <h1 class="main-title">Product Manager</h1>
        <p class="subtitle">Manage your products using JavaScript and Local Storage</p>

        <div class="form-container">
            <div class="input-group">
                <input type="text" id="productName" placeholder="Product name" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="number" id="productPrice" placeholder="Product price" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="number" id="productQuantity" placeholder="Product quantity" autocomplete="off">
            </div>
            <p id="message"></p>
            <button id="saveBtn">Save Product</button>

        </div>

        <div class="products-section">
            <h2>Products</h2>
            <p>Total products: <span id="productsCount">0</span>
            </p>
            <div id="productsDisplayContainer"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
